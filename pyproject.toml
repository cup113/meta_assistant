[project]
name = "meta-assistant"
version = "1.3.2"
description = "Windows system tray launcher for Python scripts"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG"]
ignore = ["UP046"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["meta_assistant"]
extraPaths = ["typings"]
